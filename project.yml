name: Overhang
options:
  bundleIdPrefix: pro.imnot
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Overhang:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.overhang
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Overhang
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Overhang AppStore
    dependencies:
      - target: OverhangExtension
  OverhangExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes: [Resources]
      - path: Extension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.overhang.extension
        PRODUCT_NAME: Overhang Extension
        PRODUCT_MODULE_NAME: OverhangExtension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Overhang Extension AppStore
  OverhangUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.overhang.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Overhang
    dependencies:
      - target: Overhang
schemes:
  Overhang:
    build:
      targets:
        Overhang: all
    test:
      targets: [OverhangUITests]
