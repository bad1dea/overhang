name: Simulator screenshots

# Boots the iPhone Duo simulator, installs Overhang and captures the app and Safari on the front screen.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -switch "$xc"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Find the Duo
        run: |
          xcrun simctl list devicetypes | tee devicetypes.txt
          xcrun simctl list runtimes | tee runtimes.txt
          type="$(grep -i 'duo' devicetypes.txt | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')"
          test -n "$type"
          # The Duo has its own runtime build (iOS-27-2-iPhone19-4); the general ones refuse it as incompatible.
          udid=""
          for runtime in $(grep -E '^iOS 27' runtimes.txt | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]*).*/\1/' | sort -r); do
            udid="$(xcrun simctl create Duo "$type" "$runtime" 2>/dev/null)" && { echo "runtime=$runtime"; break; }
          done
          test -n "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run the screenshot test
        run: |
          xcodegen generate
          xcrun simctl ui "$UDID" appearance light
          xcodebuild test -project Overhang.xcodeproj -scheme Overhang -destination "id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/shots.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | grep -E "error|Test Case|passed|failed|\*\*" || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path build/shots.xcresult --output-path shots || true
          ls -la shots
          # Where Safari keeps extension state, for turning Overhang on without going through Settings.
          safari="$(xcrun simctl get_app_container "$UDID" com.apple.mobilesafari data 2>/dev/null || true)"
          { echo "safari data: $safari"; find "$safari/Library/Safari" -maxdepth 3 2>/dev/null; } > shots/safari-files.txt
          for f in $(find "$safari/Library/Safari/WebExtensions" -type f 2>/dev/null); do
            echo "== $f"; plutil -p "$f" 2>/dev/null || head -c 2000 "$f"
          done > shots/webextensions.txt 2>&1 || true
          find ~/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Preferences -name '*afari*' > shots/safari-prefs.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
