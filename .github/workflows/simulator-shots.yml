name: Simulator screenshots

# Boots the iPhone Duo simulator, installs Overhang and captures the app and Safari on the front screen.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to open in Safari
        default: https://en.wikipedia.org/wiki/Overhang_(architecture)

jobs:
  shots:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -switch "$xc"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Find the Duo
        run: |
          xcrun simctl list devicetypes | tee devicetypes.txt
          xcrun simctl list runtimes | tee runtimes.txt
          type="$(grep -i 'duo' devicetypes.txt | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')"
          test -n "$type"
          # The Duo has its own runtime build (iOS-27-2-iPhone19-4); the general ones refuse it as incompatible.
          udid=""
          for runtime in $(grep -E '^iOS 27' runtimes.txt | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]*).*/\1/' | sort -r); do
            udid="$(xcrun simctl create Duo "$type" "$runtime" 2>/dev/null)" && { echo "runtime=$runtime"; break; }
          done
          test -n "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Build and install
        run: |
          xcodegen generate
          xcodebuild -project Overhang.xcodeproj -scheme Overhang -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | tail -5
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Overhang.app
      - name: Capture
        run: |
          mkdir -p shots
          xcrun simctl io "$UDID" enumerate | tee shots/displays.txt || true
          shoot() {
            for d in internal external; do
              xcrun simctl io "$UDID" screenshot --display="$d" "shots/$1-$d.png" || true
            done
            xcrun simctl io "$UDID" screenshot "shots/$1.png" || true
          }
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" pro.imnot.overhang
          sleep 6
          shoot app
          xcrun simctl openurl "$UDID" "${{ inputs.url }}"
          sleep 12
          shoot safari
          find ~/Library/Developer/CoreSimulator/Devices/$UDID/data -iname '*webextension*' -o -iname '*SafariExtension*' 2>/dev/null | head -40 > shots/extension-files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            shots
            devicetypes.txt
            runtimes.txt
