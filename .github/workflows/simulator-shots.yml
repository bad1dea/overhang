name: Simulator screenshots

# Boots the iPhone Duo simulator, installs Overhang and captures the app and Safari on the front screen.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -switch "$xc"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Find the Duo
        run: |
          xcrun simctl list devicetypes | tee devicetypes.txt
          xcrun simctl list runtimes | tee runtimes.txt
          type="$(grep -i 'duo' devicetypes.txt | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')"
          test -n "$type"
          # The Duo has its own runtime build (iOS-27-2-iPhone19-4); the general ones refuse it as incompatible.
          udid=""
          for runtime in $(grep -E '^iOS 27' runtimes.txt | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]*).*/\1/' | sort -r); do
            udid="$(xcrun simctl create Duo "$type" "$runtime" 2>/dev/null)" && { echo "runtime=$runtime"; break; }
          done
          test -n "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Before turning Overhang on
        run: |
          xcodegen generate
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl privacy "$UDID" grant location com.apple.mobilesafari || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcodebuild build-for-testing -project Overhang.xcodeproj -scheme Overhang -destination "id=$UDID" \
            -derivedDataPath build/dd CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO | tail -2
          xcodebuild test-without-building -project Overhang.xcodeproj -scheme Overhang -destination "id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/a.xcresult \
            -only-testing:OverhangUITests/Shots/testA 2>&1 | grep -E "error|Test Case|\*\*" || true
      - name: Turn Overhang on in Safari's extension state
        run: |
          # There's no command for Allow Extension, and the simulator's Settings doesn't list apps, so the switch
          # and the site access are written into Safari's state file directly (same keys as Safari on the Mac).
          xcrun simctl terminate "$UDID" com.apple.mobilesafari || true
          sleep 2
          plist="$(xcrun simctl get_app_container "$UDID" com.apple.mobilesafari data)/Library/Safari/WebExtensions/Extensions.plist"
          python3 - "$plist" <<'PY'
          import plistlib, sys, datetime
          path = sys.argv[1]
          with open(path, "rb") as f:
              state = plistlib.load(f)
          later = datetime.datetime(4000, 1, 1)
          for key, ext in state.items():
              if key.startswith("pro.imnot.overhang.extension"):
                  ext["Enabled"] = True
                  ext["GrantedPermissionOrigins"] = {"<all_urls>": later}
                  ext["GrantedPermissions"] = {p: later for p in ext.get("Permissions", [])}
          with open(path, "wb") as f:
              plistlib.dump(state, f, fmt=plistlib.FMT_BINARY)
          print(state)
          PY
      - name: After turning Overhang on
        run: |
          xcodebuild test-without-building -project Overhang.xcodeproj -scheme Overhang -destination "id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/b.xcresult \
            -only-testing:OverhangUITests/Shots/testB 2>&1 | grep -E "error|Test Case|\*\*" || true
          xcrun simctl ui "$UDID" appearance dark
          xcodebuild test-without-building -project Overhang.xcodeproj -scheme Overhang -destination "id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/c.xcresult \
            -only-testing:OverhangUITests/Shots/testC 2>&1 | grep -E "error|Test Case|\*\*" || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          for r in a b c; do xcrun xcresulttool export attachments --path build/$r.xcresult --output-path shots/$r || true; done
          plist="$(xcrun simctl get_app_container "$UDID" com.apple.mobilesafari data)/Library/Safari/WebExtensions/Extensions.plist"
          plutil -p "$plist" > shots/extensions-after.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
