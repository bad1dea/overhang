name: App Store

# Uploads the listing in fastlane/metadata and picks the build. Tick submit to send it for review as well.
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number (empty for the newest)
        required: false
      submit:
        description: Submit for review
        type: boolean
        default: false
      tip:
        description: Make the tip in-app purchase first
        type: boolean
        default: false

jobs:
  store:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
      BUILD: ${{ inputs.build }}
      SUBMIT: ${{ inputs.submit && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - if: inputs.tip
        run: bundle exec fastlane tip
      - run: bundle exec fastlane store
